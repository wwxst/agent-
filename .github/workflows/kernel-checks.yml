name: kernel-checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.16.0', '22']
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript strict check
        run: npm run check
      - name: Run deterministic tests
        run: npm test

  pi-core-adapter-spike:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'experiment/pi-agent-core-adapter-spike-')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Install kernel dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript strict check
        run: npm run check
      - name: Run deterministic Kernel suite
        run: npm test
      - name: Install isolated Pi Core dependencies
        run: npm install --prefix experiments/pi-core-adapter --no-audit --no-fund
      - name: Run Pi Core adapter spike
        run: npm test --prefix experiments/pi-core-adapter
