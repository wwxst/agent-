name: Kernel checks
on:
  push:
    branches:
      - main
      - feat/kernel-m1-provider-stream
      - feat/kernel-m2-sqlite-journal
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript strict check
        run: npm run check
      - name: Offline and SQLite integration tests
        run: npm test
